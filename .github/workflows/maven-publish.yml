
name: Pet clinic CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      

jobs:
  build:

    runs-on: self-hosted

    steps:
    - name: checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven


    - name: Build with Maven
      run: ./mvnw clean package

